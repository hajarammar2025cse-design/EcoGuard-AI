{% extends 'base.html' %}

{% block title %}Edit reading{% endblock %}
{% block page_title %}Edit sensor reading (Admin){% endblock %}

{% block content %}
<div style="max-width: 860px; margin: 0 auto;">

  <div class="card">
    <div class="card-header">
      <div>
        <h3 class="card-title">Edit reading: {{ record.location }}</h3>
        <p style="font-size: 13px; color: var(--text-muted);">Timestamp: {{ record.timestamp }}</p>
      </div>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="location">Station area</label>
          <select id="location" name="location" class="form-select" required>
            {% for loc in locations %}
            <option value="{{ loc.location_name }}" {% if record.location == loc.location_name %}selected{% endif %}>
              {{ loc.location_name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group" style="display: flex; align-items: flex-end; padding-bottom: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" name="is_demo" {% if record.is_demo %}checked{% endif %} style="accent-color: var(--risk-green);"> Tag as sample data
          </label>
        </div>
      </div>

      <div class="grid-4">
        <div class="form-group">
          <label class="form-label" for="temperature">Temp (°C)</label>
          <input type="number" step="0.1" id="temperature" name="temperature" class="form-control" value="{{ record.temperature }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="humidity">Humidity (%)</label>
          <input type="number" step="0.1" id="humidity" name="humidity" class="form-control" value="{{ record.humidity }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="rainfall">Rainfall (mm)</label>
          <input type="number" step="0.1" id="rainfall" name="rainfall" class="form-control" value="{{ record.rainfall }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="water_level">Water level (m)</label>
          <input type="number" step="0.1" id="water_level" name="water_level" class="form-control" value="{{ record.water_level }}" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="wind_speed">Wind speed (km/h)</label>
          <input type="number" step="0.1" id="wind_speed" name="wind_speed" class="form-control" value="{{ record.wind_speed }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="smoke_level">Vegetation dryness code (0-100)</label>
          <input type="number" step="0.1" id="smoke_level" name="smoke_level" class="form-control" value="{{ record.smoke_level }}" required>
        </div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label class="form-label" for="pm25">PM2.5 (µg/m³)</label>
          <input type="number" step="0.1" id="pm25" name="pm25" class="form-control" value="{{ record.pm25 }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="pm10">PM10 (µg/m³)</label>
          <input type="number" step="0.1" id="pm10" name="pm10" class="form-control" value="{{ record.pm10 }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="co">CO (mg/m³)</label>
          <input type="number" step="0.01" id="co" name="co" class="form-control" value="{{ record.co }}" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="no2">NO2 (µg/m³)</label>
          <input type="number" step="0.1" id="no2" name="no2" class="form-control" value="{{ record.no2 }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="so2">SO2 (µg/m³)</label>
          <input type="number" step="0.1" id="so2" name="so2" class="form-control" value="{{ record.so2 }}" required>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
          Save changes →
        </button>
        <a href="/monitoring/" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
